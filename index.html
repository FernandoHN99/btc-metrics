<!DOCTYPE html>
<html lang="pt-BR">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

   <title>BTC Metrics Dashboard</title>
   <link rel="stylesheet" href="./styles.css">
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
   <header>
      <h1>📊 Bitcoin Metrics</h1>
   </header>

   <main>
      <section class="metrics">
         <div class="metric-card">
            <span>Price</span>
            <strong id="metric-price">—</strong>
         </div>

         <div class="metric-card">
            <span>MVRV</span>
            <strong id="metric-mvrv">—</strong>
         </div>

         <div class="metric-card">
               <span>Mayer Multiple</span>
               <strong id="metric-mayer">—</strong>
         </div>

         <div class="metric-card">
            <span>Fear & Greed</span>
            <strong id="metric-fg">—</strong>
         </div>

         <div class="metric-card larger-metric">
            <span>Indicator</span>
            <strong id="metric-score">-</strong>
         </div>

      </section>

      <!-- CHART -->
      <section class="chart">
         <div class="chart-card">
            <div class="time-filters">
               <button data-range="1D">1D</button>
               <button data-range="7D">7D</button>
               <button data-range="1M">1M</button>
               <button data-range="6M">6M</button>
               <button data-range="YTD">YTD</button>
               <button data-range="1Y">1Y</button>
               <button data-range="3Y">3Y</button>
               <button data-range="5Y">5Y</button>
            </div>
            <div class="chart-container">
               <canvas class="graph-main" id="marketChart"></canvas>
            </div>
         </div>

         <div id="last-update-datetime"></div>
      </section>

   </main>


   <script type="module" src="./js/main.js"></script>
</body>

</html>
