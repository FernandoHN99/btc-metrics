<!DOCTYPE html>
<html lang="pt-BR">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>BTC Metrics Dashboard</title>

   <link rel="stylesheet" href="./styles.css">
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
   <header>
      <h1>📊 Bitcoin Metrics</h1>
   </header>

   <main>
      <!-- METRICS -->
      <section class="metrics">
         <div class="metric-card">
            <span>Preço BTC</span>
            <strong id="metric-price">—</strong>
         </div>

         <div class="metric-card">
            <span>MVRV</span>
            <strong id="metric-mvrv">—</strong>
         </div>

         <div class="metric-card">
            <span>Mayer Multiple</span>
            <strong id="metric-mayer">—</strong>
         </div>

         <div class="metric-card">
            <span>Fear & Greed</span>
            <strong id="metric-fg">—</strong>
         </div>
      </section>

      <!-- ACTION INDICATOR -->
      <section class="sugestion-card">
         
         <div class="bar-card">
            <!-- <h2 class="action-title">Forte Compra</h2> -->

            <div class="action-bar">
               <div class="bar-segment sell"></div>
               <div class="bar-segment hold"></div>
               <div class="bar-segment buy active"></div>
            </div>

            <div class="action-labels">
               <span class="sell">Venda</span>
               <span class="hold">Manter</span>
               <span class="buy">Compra</span>
            </div>
         </div>

         <div class="score-card">
            <h2 class="action-title">Score Sugestion</h2>
            <h2 class="action-score">7.8 / 10</h2>
         </div>

      </section>


      <!-- CHART -->
      <section class="chart-card">
         <div class="time-filters">
            <button data-range="1D">1D</button>
            <button data-range="7D">7D</button>
            <button data-range="1M">1M</button>
            <button data-range="6M">6M</button>
            <button data-range="YTD">YTD</button>
            <button data-range="1Y">1Y</button>
            <button data-range="3Y">3Y</button>
            <button data-range="5Y">5Y</button>
         </div>

         <div class="chart-container">
            <canvas class="graph-main" id="marketChart"></canvas>
         </div>

      </section>


   </main>

   <footer>
      Dados on-chain • GitHub Pages
   </footer>

   <script type="module" src="./js/main.js"></script>
</body>

</html>
